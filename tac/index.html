
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>They Are Coming - Zombie Defense Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background: #0f0f0f; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .card { 
            background: #1e1e1e; 
            width: 90%; 
            max-width: 700px; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            color: #fff;
        }

        .card-header img { width: 100%; height: auto; display: block; border-bottom: 3px solid #333; }

        .card-body { padding: 40px 30px; text-align: center; }
        h1 { margin: 0 0 10px; font-size: 2.2rem; }
        p { color: #888; margin-bottom: 35px; font-size: 1rem; }

        .button-group { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            align-items: center; 
        }

        @media (min-width: 600px) {
            .button-group { flex-direction: row; justify-content: center; }
        }

        .btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: 600; 
            color: #fff; 
            transition: 0.2s ease-in-out; 
            min-width: 120px;
            font-size: 1rem;
        }

        .google { background: #34a853; border: 0 solid #24793b; border-bottom-width: 4px; }
        .apple { background: #606060; border: 0 solid #4d4d4d; border-bottom-width: 4px; }
        .steam { background: #1b2838; border: 0 solid #0d131b; border-bottom-width: 4px; }

        .btn i { font-size: 1.2rem; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NC09SXV6G9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-NC09SXV6G9');
    </script>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <img src="https://lh7-rt.googleusercontent.com/formsz/AN7BsVArYwsPdjud2oBuoN9q5cI9Xat6yq9ATt3R2Q_PlN-sQ_xbhsSr7_Zj4Vfpa4rNyFZExG2bw7BWfF1bCe84jjkbHQol1MeYJTrT0rjo6QCPG-PsnlWfHVymNNTva-pT4-9i1gAVoaZPEDdA09JX7Y86wfaDs1T59or-Og=fcrop64=1,00000000ffffffff?key=fKfia4ALY1qjyG2WVdRDpQ" alt="Game Banner">
        </div>

        <div class="card-body">
            <h1>They Are Coming Zombie Defense</h1>
            <p>You have to start all over again when the game is over, be a strong survivor!</p>

            <div class="button-group">
                                    <a href="https://play.google.com/store/apps/details?id=dev.onhit.theyarecoming" class="btn google">
                        <i class="fa-brands fa-google-play"></i> Google Play
                    </a>
                
                                    <a href="https://apps.apple.com/us/app/they-are-coming-zombie-defense/id1576645378" class="btn apple">
                        <i class="fa-brands fa-apple"></i> App Store
                    </a>
                
                                    <a href="https://store.steampowered.com/app/2630080/They_Are_Coming/" class="btn steam">
                        <i class="fa-brands fa-steam"></i> Steam
                    </a>
                            </div>
        </div>
    </div>

</body>
</html>
